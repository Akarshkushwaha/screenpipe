[package]
name = "screenpipe-db"
version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
license-file.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
arrow = { version = "54.2.0" }
chrono = { workspace = true }
criterion = { workspace = true }
futures = { workspace = true, features = ["std"] }
image = { workspace = true }
libsqlite3-sys = { workspace = true }
oasgen = { workspace = true }
once_cell = { workspace = true }
parquet = { version = "54.2.0", features = ["arrow", "snap"] }
rand = { workspace = true }
regex = { workspace = true }
screenpipe-config = { path = "../screenpipe-config" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlite-vec = "0.1.3"
sqlx = { workspace = true, features = [
  "chrono",
  "migrate",
] }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zerocopy = { version = "0.7.32" }

[dev-dependencies]
screenpipe-core = { path = "../screenpipe-core" }
screenpipe-secrets = { path = "../screenpipe-secrets" }
tempfile = { workspace = true }

[[bench]]
name = "db_benchmarks"
harness = false

[[bench]]
name = "new_db_benchmark"
harness = false
